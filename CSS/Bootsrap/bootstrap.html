<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="bootstrap.css" />
  </head>
  <body>
    <div class="container row justify-content-center text-center align-items-center mx-auto">
      <section class="container-heading">
        <h2>Pricing</h2>
        <p>Please checkout our most effective payment models</p>
      </section>

      <section class="card-container row flex gap-5 justify-content-evenly">

        <!-- Card-1 -->
        <div class="card col-lg-3 col-md-5">
          <h3 class="card-header bg-light">Free</h3>
          <div class="card-body row">
            <h2 class="price mt-2">$0/mo</h2>
            <div class="text my-2 ">
              <span>10 users included</span>
              <br>
              <span>2 GB of storage</span>
              <br>
              <span>Email support</span>
            </div>

            <button class="btn btn-outline-primary col-5 mx-auto my-2">
              <span>Sign up for free</span>
            </button>
          </div>
        </div>

         <!-- Card-2 -->
        <div class="card col-lg-3 col-md-5">
          <h3 class="card-header bg-light">Pro</h3>
          <div class="card-body row">
            <h2 class="price mt-2">$15/mo</h2>
            <div class="text my-2 ">
              <span>20 users included</span>
              <br>
              <span>10 GB of storage</span>
              <br>
              <span>Priority email support</span>
            </div>

            <button class="btn btn-primary col-5 mx-auto my-2">
              <span>Get Started</span>
            </button>
          </div>
        </div>

         <!-- Card-3 -->
        <div class="card col-lg-3 col-md-10">
          <h3 class="card-header bg-light">Enterprise</h3>
          <div class="card-body row">
            <h2 class="price mt-2">$29/mo</h2>
            <div class="text my-2 ">
              <span>30 users included</span>
              <br>
              <span>15 GB of storage</span>
              <br>
              <span>Phone & email support</span>
            </div>

            <button class="btn btn-primary col-5 mx-auto my-2">
              <span>Contact us</span>
            </button>
          </div>
        </div>
      </section>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
