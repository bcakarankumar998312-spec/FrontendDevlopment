
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinkit Clone</title>

  <link rel="stylesheet" href="blinkit.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="logo">
      <h1>RecipeCart</h1>
    </div>

    <div class="delivery">
      <h4>Delivery in 10 minutes</h4>
      <p>Patna, Bihar</p>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Search for products">
    </div>

    <button class="login-btn">Login</button>

    <button class="cart-btn">
      <i class="fa-solid fa-cart-shopping"></i>
      My Cart(<span id="cart-count">0</span>)
    </button>

    
  </nav>


  <!-- HERO BANNER -->
  <section class="hero">
    <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=1200&auto=format&fit=crop" alt="banner">
  </section>


  <!-- CATEGORY SECTION -->
  <section class="categories">

    <div class="category-card">
      <img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
      <p>Fruits</p>
    </div>

    <div class="category-card">
      <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png">
      <p>Vegetables</p>
    </div>

    <div class="category-card">
      <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png">
      <p>Dairy</p>
    </div>

    <div class="category-card">
      <img src="https://cdn-icons-png.flaticon.com/512/2553/2553691.png">
      <p>Snacks</p>
    </div>

  </section>


  <!-- PRODUCTS -->
  <section class="products">

    
  </section>

  <!-- CART SIDEBAR -->
  <div class="cart-sidebar hidden">
    <h2>Your Cart</h2>
    <div class="cart-items">
      
    </div>
  </div>

  <script src="blinkit.js"></script>
</body>
</html>
